syntax = "proto3";

package velony.identity.api.v1;

import "velony/identity/api/v1/user.proto";
import "velony/identity/api/v1/auth.proto";
import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/protobuf/empty.proto";

option go_package = "github.com/velonyapp/identity/gen/api/v1;apiv1";

// The identity service.
service IdentityService {
  option (google.api.default_host) = "identity.velony.app";

  // Retrieves a user.
  rpc GetUser(GetUserRequest) returns (User) {
    option (google.api.http) = {
      get: "/v1/{name=users/*}"
    };
    option (google.api.method_signature) = "name";
  }

  // Retrieves multiple users.
  rpc BatchGetUsers(BatchGetUsersRequest) returns (BatchGetUsersResponse) {
    option (google.api.http) = {
      get: "/v1/users:batchGet"
    };
  }

  // Updates a user.
  rpc UpdateUser(UpdateUserRequest) returns (User) {
    option (google.api.http) = {
      patch: "/v1/{user.name=users/*}"
      body : "user"
    };
    option (google.api.method_signature) = "user,update_mask";
  }

  // Replaces the avatar of a user.
  rpc ReplaceUserAvatar(ReplaceUserAvatarRequest) returns (User) {
    option (google.api.http) = {
      post: "/v1/{name=users/*}:replaceAvatar"
      body: "*"
    };
  }

  // Deletes a user.
  rpc DeleteUser(DeleteUserRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/v1/{name=users/*}"
    };
    option (google.api.method_signature) = "name";
  }

  // Login a user.
  rpc LoginAuth(LoginAuthRequest) returns (LoginAuthResponse) {
    option (google.api.http) = {
      post: "/v1/auth:login"
      body: "*"
    };
    option (google.api.method_signature) = "identity,password";
  }

  // Register a user.
  rpc RegisterAuth(RegisterAuthRequest) returns (RegisterAuthResponse) {
    option (google.api.http) = {
      post: "/v1/auth:register"
      body: "*"
    };
    option (google.api.method_signature) = "full_name,username,password";
  }

  // Refresh user session.
  rpc RefreshAuth(RefreshAuthRequest) returns (RefreshAuthResponse) {
    option (google.api.http) = {
      post: "/v1/auth:refresh"
      body: "*"
    };
    option (google.api.method_signature) = "refresh_token";
  }
}