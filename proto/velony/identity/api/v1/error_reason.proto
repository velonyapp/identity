syntax = "proto3";

package velony.identity.api.v1;

option go_package = "github.com/velony-app/identity/gen/api/v1;apiv1";

enum ErrorReason {
  ERROR_REASON_UNSPECIFIED = 0;

  USER_NOT_FOUND          = 1;
  USERNAME_ALREADY_EXISTS = 2;

  INVALID_USERNAME      = 3;
  INVALID_FULL_NAME     = 4;
  INVALID_EMAIL         = 5;
  INVALID_PASSWORD      = 6;
  INVALID_REFRESH_TOKEN = 7;
  INVALID_CREDENTIALS   = 8;
}