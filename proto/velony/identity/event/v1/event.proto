syntax = "proto3";

package velony.identity.event.v1;

import "google/protobuf/timestamp.proto";
import "google/protobuf/any.proto";

option go_package = "github.com/velonyapp/identity/gen/event/v1;eventv1";

message Event {
  string                    id         = 1;
  string                    source     = 2;
  string                    type       = 3;
  google.protobuf.Timestamp occur_time = 4;
  google.protobuf.Any       payload    = 5;
}
