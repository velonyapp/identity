syntax = "proto3";

package velony.identity.event.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/velony-app/identity/gen/event/v1;eventv1";

message UserCreatedPayload {
  string                    user_id      = 1;
  string                    username     = 2;
  string                    full_name    = 3;
  optional string           avatar_key = 4;
  google.protobuf.Timestamp create_time  = 5;
}
