syntax = "proto3";

package velony.identity.event.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/velonyapp/identity/gen/event/v1;eventv1";

message UserCreatedPayload {
  string          username   = 1;
  optional string email      = 2;
  string          full_name  = 3;
  optional string avatar_key = 4;
}
