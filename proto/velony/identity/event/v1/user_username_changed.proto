syntax = "proto3";

package velony.identity.event.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/velonyapp/identity/gen/event/v1;eventv1";

message UserUsernameChangedPayload {
  string                    user_id     = 1;
  string                    username    = 2;
  google.protobuf.Timestamp update_time = 3;
}
