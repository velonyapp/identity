syntax = "proto3";
package kratos.api;

option go_package = "github.com/velonyapp/identity/internal/conf";

import "buf/validate/validate.proto";
import "google/protobuf/duration.proto";

message Bootstrap {
  Auth auth = 1 [
    (buf.validate.field).required = true
  ];
  Transport transport = 12 [
    (buf.validate.field).required = true
  ];
  Data data = 13 [
    (buf.validate.field).required = true
  ];
  Gateway gateway = 14 [
    (buf.validate.field).required = true
  ];
  Telemetry telemetry = 15;
}

message Auth {
  message AccessToken {
    string secret = 1 [
      (buf.validate.field).string.min_bytes = 32
    ];

    google.protobuf.Duration ttl = 2 [
      (buf.validate.field).required = true,
      (buf.validate.field).duration.gt = {}
    ];
  }

  message RefreshToken {
    google.protobuf.Duration ttl = 1 [
      (buf.validate.field).required = true,
      (buf.validate.field).duration.gt = {}
    ];
  }

  AccessToken  access_token  = 1 [
    (buf.validate.field).required = true
  ];
  RefreshToken refresh_token = 2 [
    (buf.validate.field).required = true
  ];
}

message Transport {
  message HTTP {
    string address = 1 [
      (buf.validate.field).string.host_and_port = true
    ];

    google.protobuf.Duration timeout = 2 [
      (buf.validate.field).duration.gt = {}
    ];
  }

  message GRPC {
    string address = 1 [
      (buf.validate.field).string.host_and_port = true
    ];

    google.protobuf.Duration timeout = 2 [
      (buf.validate.field).duration.gt = {}
    ];
  }

  message Kafka {
    repeated string brokers = 1 [
      (buf.validate.field).repeated = {
      min_items: 1
      unique: true
      items: { string: { min_len: 1 } }
      }
    ];

    google.protobuf.Duration timeout = 2 [
      (buf.validate.field).duration.gt = {}
    ];
  }

  HTTP http = 1 [
    (buf.validate.field).required = true
  ];
  GRPC grpc = 2 [
    (buf.validate.field).required = true
  ];
  Kafka kafka = 3 [
    (buf.validate.field).required = true
  ];
}

message Data {
  message MySQL {
    string dsn = 1 [
      (buf.validate.field).string.min_len = 1
    ];

    optional uint32 max_open_connections = 2;
    optional uint32 max_idle_connections = 3;

    google.protobuf.Duration max_connection_lifetime = 4 [
      (buf.validate.field).duration.gte = {}
    ];

    option (buf.validate.message).cel = {
      id        : "mysql.pool_limits"
      message   : "max_idle_connections cannot exceed max_open_connections unless max_open_connections is 0"
      expression: "this.max_open_connections == 0u || this.max_idle_connections <= this.max_open_connections"
    };
  }

  MySQL mysql = 1 [
    (buf.validate.field).required = true
  ];
}

message Gateway {
  message Asset {
    string endpoint = 1 [
      (buf.validate.field).string.min_len = 1
    ];

    google.protobuf.Duration timeout = 2 [
      (buf.validate.field).required = true,
      (buf.validate.field).duration.gt = {}
    ];
  }

  Asset asset = 1 [
    (buf.validate.field).required = true
  ];
}

message Telemetry {
  enum Protocol {
    PROTOCOL_UNSPECIFIED = 0;
    GRPC                 = 1;
    HTTP_PROTOBUF        = 2;
  }

  message Tracing {
    Protocol protocol = 1 [
      (buf.validate.field).enum = { defined_only: true, not_in: [0] }
    ];
    string endpoint = 2 [
      (buf.validate.field).string.min_len = 1
    ];
    optional string authorization = 3 [
      (buf.validate.field).string.min_len = 1
    ];

    optional double sample_ratio = 4 [
      (buf.validate.field).double = { gte: 0.0, lte: 1.0 }
    ];
  }

  message Metrics {
    Protocol protocol = 1 [
      (buf.validate.field).enum = { defined_only: true, not_in: [0] }
    ];
    string endpoint = 2 [
      (buf.validate.field).string.min_len = 1
    ];
    optional string authorization = 3 [
      (buf.validate.field).string.min_len = 1
    ];

    google.protobuf.Duration export_interval = 4 [
      (buf.validate.field).required = true,
      (buf.validate.field).duration.gt = {}
    ];
  }

  Tracing tracing = 1;
  Metrics metrics = 2;
}
